<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="2048" viewBox="0 0 1024 2048">
  <!--
    Your Drawings Real Life — Figure #2 "Bust" (dress-form bust on a stand).
    Hand-drawn fashion technical flat. Whole figure drawn once, sliced into
    per-region parts by scripts/build-figures.mjs. The stand is ink-only
    (no skin fill) so skin tinting leaves it as line work.
  -->
  <defs>
    <filter id="handwobble" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.010" numOctaves="2" seed="12" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <style>
      .skin { fill:#ddd5cc; stroke:none; }
      .ink  { fill:none; stroke:#332d28; stroke-linecap:round; stroke-linejoin:round; }
      .w1 { stroke-width:3.6; }
      .w2 { stroke-width:5.0; }
      .w3 { stroke-width:6.8; }
      .seam { fill:none; stroke:#7a7067; stroke-width:2.8; stroke-dasharray:12 10; stroke-linecap:round; }
    </style>
  </defs>
  <g filter="url(#handwobble)">

    <g id="part-torso" class="part">
