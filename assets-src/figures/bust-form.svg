      <path class="seam" d="M420 926 C 404 1080 410 1300 428 1502"/>
      <path class="seam" d="M604 926 C 620 1080 614 1300 596 1502"/>
      <path class="ink w1" d="M500 1512 C 498 1640 497 1760 496 1880"/>
      <path class="ink w1" d="M524 1512 C 522 1640 521 1760 520 1880"/>
