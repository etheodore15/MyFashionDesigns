      <path class="ink w3" d="M798 936 C 798 1020 786 1096 764 1164 C 740 1240 712 1302 698 1372 C 689 1416 685 1452 687 1486"/>
      <path class="ink w2" d="M336 1488 C 404 1516 620 1516 688 1488"/>
